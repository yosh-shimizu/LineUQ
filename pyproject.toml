[build-system]
requires = ["setuptools>=64", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "lineuq"
version = "0.1.0"
description = "Measured line-segment localisation uncertainty for geometric estimation"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Yoshiyasu Shimizu", email = "yoshiyasu.shimizu.research@gmail.com" }]
keywords = [
  "line segment detection",
  "uncertainty quantification",
  "vanishing point",
  "Manhattan world",
  "computer vision",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.20"]

[project.urls]
Homepage = "https://github.com/yosh-shimizu/LineUQ"
Source = "https://github.com/yosh-shimizu/LineUQ"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
